[project]
name = "blockyard"
version = "0.1.0"
description = "Web shell for watching an agent design Minecraft structures in code"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pillow>=11",
  "playwright>=1.63.0",
  "pyyaml>=6",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
blockyard = "blockyard.app:main"
blockyard-gallery = "blockyard.gallery:main"
blocks = "blockyard.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockyard"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"blockyard/builders/showcases/*-*.py" = ["F821", "N999"]
