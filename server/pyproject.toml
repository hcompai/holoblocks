[project]
name = "blockyard"
version = "0.1.0"
description = "Toolkit for an agent designing Minecraft structures in code"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "pillow>=11",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
blockyard-gallery = "blockyard.gallery:main"
blocks = "blockyard.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockyard"]

[tool.ruff]
line-length = 120
