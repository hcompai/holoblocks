name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: server
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' web/package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run build
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - working-directory: web
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
          retention-days: 7

  deploy:
    needs: [server, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://blocks.hcompany.ai
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_IU7YWZ6TFEyn6wR3s7Dd7uEH
      VERCEL_PROJECT_ID: prj_vc11JR6zOv7gpGGTBy7uBCWy6cDq
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: server
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npx playwright install --with-deps chromium && npm install --global vercel@60
      # Deploys finish in whatever order their tests do: only the branch's latest commit may reach production.
      - name: Deploy, unless a newer commit landed, which deploys itself
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_REF"
          latest=$(git rev-parse FETCH_HEAD)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipped: ${latest::7} is newer and deploys itself."
            exit 0
          fi
          scripts/deploy.sh --prod
