name: Sync public

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'hcompai/blockyard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/sync-public.sh
        env:
          PUBLIC: hcompai/holoblocks
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
